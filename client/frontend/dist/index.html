<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LocalTunnel</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="panel">
    <header>
      <h1>LocalTunnel</h1>
    </header>

    <div class="target-header">
      <label for="localTarget">Local app address / routes <span class="hint">(shared by both modes)</span></label>
      <button id="toggleGatewayBtn" type="button" class="text-btn">Gateway Mode (Routes)</button>
    </div>
    <div id="singleTargetBox">
      <input id="localTarget" value="http://127.0.0.1:3000" placeholder="http://127.0.0.1:3000" />
    </div>
    <div id="gatewayTargetBox" class="hidden">
      <textarea id="gatewayRoutes" rows="5" placeholder="/auth  -> http://127.0.0.1:8084&#10;/login -> http://127.0.0.1:8082&#10;/user  -> http://127.0.0.1:8085&#10;/otp   -> http://127.0.0.1:8800&#10;/core  -> http://127.0.0.1:8083&#10;/      -> http://127.0.0.1:3000"></textarea>
      <div class="gateway-hint">Routes context paths to different ports through a single gateway port.</div>
    </div>

    <!-- LOCAL NETWORK MODE -->
    <section class="mode-card">
      <div class="mode-head">
        <div class="dot" id="lanDot"></div>
        <h2>Local network</h2>
        <span class="mode-sub">no internet or relay needed</span>
      </div>

      <label for="lanPort">Port(s) to share <span class="hint">(e.g. 9090 or 8080-8088)</span></label>
      <input id="lanPort" placeholder="9090 or 8080-8088" value="9090" />

      <label class="checkbox-row">
        <input type="checkbox" id="lanCors" />
        <span>Add permissive CORS headers</span>
      </label>

      <button id="lanBtn">Share on local network</button>

      <section id="lanUrlBox" class="url-box hidden">
        <span class="url-label">Reachable on your WiFi/network at</span>
        <code id="lanUrl">—</code>
      </section>
    </section>

    <!-- PUBLIC INTERNET MODE -->
    <section class="mode-card">
      <div class="mode-head">
        <div class="dot" id="pubDot"></div>
        <h2>Public internet</h2>
        <span class="mode-sub">via your relay server</span>
      </div>

      <label for="relayAddr">Relay address</label>
      <input id="relayAddr" placeholder="1.2.3.4:7000" value="127.0.0.1:7000" />

      <label for="subdomain">Subdomain <span class="hint">(optional)</span></label>
      <input id="subdomain" placeholder="leave blank for a random one" />

      <label class="checkbox-row">
        <input type="checkbox" id="pubCors" />
        <span>Add permissive CORS headers</span>
      </label>

      <button id="pubBtn">Start public tunnel</button>

      <section id="pubUrlBox" class="url-box hidden">
        <span class="url-label">Public tunnel</span>
        <code id="pubUrl">—</code>
      </section>
    </section>

    <section class="log-header">Activity</section>
    <div id="log" class="log"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
