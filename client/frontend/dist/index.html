<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>LocalTunnel</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── TAB BAR ──────────────────────────────────────────── -->
  <nav class="tabbar">
    <div class="tabbar-brand">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      LocalTunnel
    </div>
    <div class="tabs">
      <button class="tab active" data-tab="settings">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M4.93 4.93a10 10 0 0 0 0 14.14"/></svg>
        Settings
      </button>
      <button class="tab" data-tab="logs">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
        Logs
        <span class="badge" id="logBadge" style="display:none">0</span>
      </button>
    </div>
  </nav>

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- TAB: SETTINGS                                         -->
  <!-- ══════════════════════════════════════════════════════ -->
  <div class="tab-content active" id="tab-settings">

    <!-- Target -->
    <div class="card">
      <div class="card-head">
        <span class="card-title">Local app address</span>
        <button id="toggleGatewayBtn" type="button" class="pill-btn">Gateway Mode</button>
      </div>
      <div id="singleTargetBox">
        <input id="localTarget" value="http://127.0.0.1:3000" placeholder="http://127.0.0.1:3000" />
      </div>
      <div id="gatewayTargetBox" class="hidden">
        <textarea id="gatewayRoutes" rows="9"
          placeholder="/dfs-authorization-server  -> http://127.0.0.1:8082&#10;/dfs-login-management      -> http://127.0.0.1:8085&#10;/dfs-user-management       -> http://127.0.0.1:8086&#10;/mfs-user-management       -> http://127.0.0.1:9085&#10;/dfs-otp-management        -> http://127.0.0.1:8084&#10;/contract-management-service -> http://127.0.0.1:8083&#10;/dfs-core                  -> http://127.0.0.1:8800&#10;/escrow-support-service    -> http://127.0.0.1:8092&#10;/escrow-financial-service  -> http://127.0.0.1:8088&#10;/dfs-balance-transfer      -> http://127.0.0.1:9096&#10;/                          -> http://127.0.0.1:3000"></textarea>
        <p class="hint">One route per line &nbsp;·&nbsp; <code>/prefix -> http://host:port</code></p>
      </div>
    </div>

    <!-- LAN mode -->
    <div class="card mode-card">
      <div class="mode-head">
        <div class="dot" id="lanDot"></div>
        <div>
          <div class="mode-title">Local Network</div>
          <div class="mode-sub">no internet or relay needed</div>
        </div>
        <div id="lanUrlPill" class="url-pill hidden">
          <code id="lanUrl">—</code>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="lanPort">Port(s)</label>
          <input id="lanPort" placeholder="9090 or 8080-8088" value="9090" />
        </div>
        <label class="toggle">
          <input type="checkbox" id="lanCors" />
          <span>CORS</span>
        </label>
      </div>

      <button id="lanBtn" class="btn-primary">Share on local network</button>
    </div>

    <!-- Public mode -->
    <div class="card mode-card">
      <div class="mode-head">
        <div class="dot" id="pubDot"></div>
        <div>
          <div class="mode-title">Public Internet</div>
          <div class="mode-sub">via your relay server</div>
        </div>
        <div id="pubUrlPill" class="url-pill hidden">
          <code id="pubUrl">—</code>
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="relayAddr">Relay address <span class="muted">(Render, Koyeb, VPS)</span></label>
          <input id="relayAddr" placeholder="your-relay.onrender.com or 1.2.3.4:7000" value="127.0.0.1:7000" />
        </div>
        <div class="field">
          <label for="subdomain">Subdomain <span class="muted">(optional)</span></label>
          <input id="subdomain" placeholder="leave blank for random" />
        </div>
      </div>

      <div class="field-row" style="margin-top:0">
        <label class="toggle">
          <input type="checkbox" id="pubCors" />
          <span>CORS</span>
        </label>
      </div>

      <button id="pubBtn" class="btn-primary">Start public tunnel</button>
    </div>

  </div><!-- /tab-settings -->

  <!-- ══════════════════════════════════════════════════════ -->
  <!-- TAB: LOGS                                             -->
  <!-- ══════════════════════════════════════════════════════ -->
  <div class="tab-content" id="tab-logs">

    <div class="log-toolbar">
      <span class="log-count-label" id="reqCount">0 requests</span>
      <button class="clear-btn" id="clearBtn">Clear</button>
    </div>

    <!-- Column headers -->
    <div class="log-head">
      <span class="lc-time">Time</span>
      <span class="lc-method">Method</span>
      <span class="lc-path">Path</span>
      <span class="lc-up">Upstream</span>
      <span class="lc-status">Status</span>
      <span class="lc-dur">Time</span>
    </div>

    <!-- Rows -->
    <div class="log-body" id="log">
      <div class="log-empty" id="logEmpty">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#2d3540" stroke-width="1.4"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>
        <span>No requests yet</span>
        <span class="log-empty-sub">Start sharing on the Settings tab to see live traffic here</span>
      </div>
    </div>

  </div><!-- /tab-logs -->

  <script src="main.js"></script>
</body>
</html>
