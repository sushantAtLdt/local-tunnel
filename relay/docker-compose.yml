services:
  relay:
    build: .
    image: localtunnel-relay
    container_name: localtunnel-relay
    restart: unless-stopped
    ports:
      - "8080:8080"   # public HTTP traffic & WebSocket control (single-port compatible)
      - "7000:7000"   # optional: legacy raw TCP control connections
    command: ["-public", ":8080", "-control", ":7000"]
    # For single-port mode only (e.g. Render, Koyeb, or single reverse-proxy port):
    # ports:
    #   - "8080:8080"
    # command: ["-public", ":8080", "-control", ""]
    #
    # To enable subdomain routing once you've set up wildcard DNS:
    # command: ["-public", ":8080", "-control", ":7000", "-domain", "tunnel.yourdomain.com"]

